# Sürekli Entegrasyon (CI)
# Her pull request'te ve main dalına her birleştirmede çalışır.
# Bu iş başarısız olursa (kırmızı) PR birleştirilemez (dal koruma kuralı).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  statik-analiz:
    name: Statik analiz (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  birim-entegrasyon:
    name: Birim ve entegrasyon testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testleri ve kapsama ölçümünü çalıştır
        run: pytest tests/unit tests/integration --cov --cov-report=term-missing

  e2e:
    name: Uçtan uca testler (Playwright)
    runs-on: ubuntu-latest
    needs: birim-entegrasyon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: E2E testlerini çalıştır
        run: pytest tests/e2e --tracing=retain-on-failure --output=test-results
      - name: Başarısız testlerin izlerini (trace) yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-izleri
          path: test-results/
          retention-days: 7
