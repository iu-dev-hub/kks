name: Hata Ekleri (Taiga kaydı için)
description: >-
  Taiga'daki bir hata kaydının ekran görüntüsü, log ve dosyaları için.
  Hata raporunun kendisi Taiga'da yazılır; Taiga'nın depolama alanı çok küçük olduğu için
  dosyalar burada tutulur.
title: "[TG-] Hata ekleri"
labels: ["hata-ekleri"]
body:
  - type: markdown
    attributes:
      value: |
        **Hata raporunu Taiga'da yazın.** Bu kayıt yalnızca dosyalar içindir.
        Kaydı oluşturduktan sonra bağlantısını Taiga'daki hata kaydına yapıştırın.
        Başlıktaki `TG-` kısmına Taiga'daki numarayı yazın (ör. `[TG-57] Hata ekleri`).
  - type: input
    id: taiga
    attributes:
      label: Taiga kaydının bağlantısı
      placeholder: https://tree.taiga.io/project/.../issue/57
    validations:
      required: true
  - type: textarea
    id: ekler
    attributes:
      label: Ekler
      description: >-
        Ekran görüntülerini buraya sürükleyip bırakın. Log ve hata mesajlarını
        kod bloğu içinde yapıştırın.
    validations:
      required: true
