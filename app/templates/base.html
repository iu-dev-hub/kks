<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | Kampüs Kütüphane Sistemi</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="logo" href="{{ url_for('home') }}">Kampüs Kütüphane Sistemi</a>
    <nav aria-label="Ana menü">
      <a href="{{ url_for('membership.index') }}">Üyelik</a>
      <a href="{{ url_for('catalog.index') }}">Katalog</a>
      <a href="{{ url_for('loans.index') }}">Ödünç</a>
      <a href="{{ url_for('fines_reports.index') }}">Ceza ve Rapor</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="message {{ category }}" role="alert">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>Yazılım Doğrulama ve Sınama dersi projesi</footer>
</body>
</html>
